<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ET820 Flight</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f3a">
<style>body{margin:0;font-family:system-ui;background:#0b1f3a;color:#fff;padding:20px}h1{font-size:22px;margin:0 0 4px}.s{opacity:.7;font-size:14px}
.bar{position:relative;height:10px;background:#244;border-radius:5px;margin:40px 0 10px}.fill{height:100%;background:#4fc3f7;border-radius:5px}
.pl{position:absolute;top:-22px;font-size:26px;transform:translateX(-50%)}.row{display:flex;justify-content:space-between}.big{font-size:34px;font-weight:700;margin-top:20px}</style></head>
<body><h1>Ethiopian ET820</h1><div class="s">Kigali KGL → Addis Ababa ADD · PNR WOWNEY · Gate B2, T2 arrival</div>
<div class="bar"><div class="fill" id="f"></div><div class="pl" id="p">✈️</div></div>
<div class="row"><div><b>KGL</b><br>1:50 am Kigali</div><div style="text-align:right"><b>ADD</b><br>4:58 am Addis</div></div>
<p class="s">Actual takeoff (Kigali time): <input id="tk" type="time" style="font-size:16px"> <button onclick="localStorage.tk=tk.value;t()">Set</button></p><div class="big" id="st"></div><div class="s" id="d"></div><p class="s">Progress is estimated from the schedule and works offline. It isn't live GPS tracking.</p>
<script>
const D0=Date.parse('2026-11-05T23:50:00Z'),DUR=(3*60+8)*6e4;let dep=D0,arr=D0+DUR;
function fmt(ms){ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.round(ms%36e5/6e4);return (h?h+'h ':'')+m+'m'}
function t(){if(localStorage.tk){const[h,m]=localStorage.tk.split(':').map(Number);let x=Date.UTC(2026,10,5,h-2,m);if(x<D0-36e5*6)x+=864e5;dep=x;arr=x+DUR;tk.value=localStorage.tk}const n=Date.now(),p=Math.min(1,Math.max(0,(n-dep)/(arr-dep)));f.style.width=p*100+'%';document.getElementById('p').style.left=p*100+'%';
st.textContent=n<dep?'Departs in '+fmt(dep-n):n<arr?(p*100).toFixed(1)+'% · '+fmt(arr-n)+' to go':'Landed';
d.textContent='Kigali time now '+new Date(n).toLocaleTimeString([], {timeZone:'Africa/Kigali',hour:'2-digit',minute:'2-digit'})+' · Addis '+new Date(n).toLocaleTimeString([], {timeZone:'Africa/Addis_Ababa',hour:'2-digit',minute:'2-digit'})}
t();setInterval(t,15000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
